<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>ลอยฝัน · ลอยกระทงออนไลน์</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Mali:wght@500;700&family=Noto+Sans+Thai:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--night:#070b24;--moon:#fff1c9;--gold:#ffb52e;--ink:#f5f0ff;--glass:rgba(10,14,48,.93);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--night);color:var(--ink);font-family:'Noto Sans Thai',system-ui,sans-serif;overflow:hidden}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{position:fixed;inset:0;width:100%;overscroll-behavior:none}
canvas#c{position:absolute;left:0;top:0;display:block;touch-action:manipulation}
h1{font-family:'Mali',serif;font-weight:700;font-size:clamp(1.5rem,6vw,2.4rem);margin:0;color:var(--moon);text-shadow:0 0 24px rgba(255,200,90,.45)}
header{position:absolute;left:0;right:0;top:env(safe-area-inset-top,0px);padding:14px 20px;pointer-events:none}
header p{margin:2px 0 0;font-size:.9rem;opacity:.85}
.panel{position:absolute;left:50%;transform:translateX(-50%);bottom:0;width:min(560px,100%);padding:12px 14px calc(12px + env(safe-area-inset-bottom,0px));background:var(--glass);border-radius:22px 22px 0 0;border:1px solid rgba(255,241,201,.18);border-bottom:0}
.pick{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.arrow{width:44px;height:44px;border-radius:50%;border:1px solid rgba(255,241,201,.35);background:rgba(255,255,255,.08);color:var(--moon);font-size:1.3rem;cursor:pointer;flex:none}
.pv{flex:1;display:flex;align-items:center;gap:10px;justify-content:center;min-width:0}
#pv{width:96px;height:64px;flex:none}
#lab{font-size:.92rem;line-height:1.35}
#lab small{display:block;opacity:.75}
.two{display:flex;gap:8px;margin-bottom:8px}
label.d{flex:1;font-size:.75rem;opacity:.9;display:grid;gap:2px;min-width:0;grid-template-columns:minmax(0,1fr)}
input,textarea{width:100%;background:rgba(255,255,255,.08);border:1px solid rgba(255,241,201,.25);border-radius:12px;color:var(--ink);font:inherit;font-size:16px;padding:8px 10px;color-scheme:dark}
.two input{margin:0;min-width:0;max-width:100%;height:40px}
input[type=date]{-webkit-appearance:none;appearance:none;text-align:left}
textarea{resize:none;height:52px;margin-bottom:8px}
.row{display:flex;gap:8px}
.btn{flex:1;border:0;border-radius:14px;padding:11px;font:inherit;font-weight:600;cursor:pointer;color:#2a1600;background:linear-gradient(135deg,#ffd36a,var(--gold))}
.btn.alt{background:rgba(255,255,255,.12);color:var(--ink)}
:focus-visible{outline:3px solid var(--moon);outline-offset:2px}
#fortune{position:absolute;inset:0;display:none;place-items:center;background:rgba(7,11,36,.6);padding:20px;z-index:5}
#fortune.on{display:grid}
.card{max-width:340px;background:#141b55;border:1px solid var(--gold);border-radius:20px;padding:24px;text-align:center;box-shadow:0 0 60px rgba(255,181,46,.25)}
.card h2{font-family:'Mali',serif;margin:0 0 8px;color:var(--gold)}
.card p{margin:0 0 16px;line-height:1.7}
#pop{position:absolute;z-index:4;width:220px;background:#141b55;border:1px solid var(--gold);border-radius:16px;padding:12px 14px;box-shadow:0 0 40px rgba(255,181,46,.3)}
#pop[hidden]{display:none}
#pop b{font-family:'Mali',serif;color:var(--gold);font-size:1.05rem}
#pop small{display:block;opacity:.7;margin:2px 0 6px}
#pop p{margin:0;line-height:1.6;font-size:.95rem}
#pop .x{position:absolute;top:2px;right:4px;width:32px;height:32px;border:0;background:none;color:var(--ink);font-size:1.3rem;cursor:pointer}
html{-webkit-text-size-adjust:100%}
@media (min-width:800px),(max-height:520px) and (orientation:landscape){
.panel{left:auto;right:max(16px,env(safe-area-inset-right,0px));bottom:max(16px,env(safe-area-inset-bottom,0px));transform:none;width:340px;max-height:calc(100% - 32px);overflow:auto;border-radius:22px;border-bottom:1px solid rgba(255,241,201,.18)}
header{padding:22px 32px}
header p{font-size:1.05rem}
}
@media (min-width:1100px){h1{font-size:3rem}}
</style>
</head>
<body>
<canvas id="c" aria-label="แม่น้ำคืนวันเพ็ญ แตะที่กระทงเพื่อดูคำอธิษฐาน"></canvas>
<header><h1>ลอยฝัน</h1><p>แตะที่กระทงเพื่ออ่านคำอธิษฐาน</p></header>

<div id="pop" hidden role="status"><button class="x" id="px" aria-label="ปิด">×</button><b id="pn"></b><small id="ps"></small><p id="pw"></p></div>

<section class="panel">
  <div class="pick">
    <button class="arrow" id="prev" type="button" aria-label="กระทงก่อนหน้า">◀</button>
    <div class="pv"><canvas id="pv"></canvas><div id="lab"></div></div>
    <button class="arrow" id="next" type="button" aria-label="กระทงถัดไป">▶</button>
  </div>
  <div class="two">
    <label class="d">วันเกิดของคุณ<input id="bd" type="date"></label>
    <label class="d">ชื่อ<input id="name" maxlength="14" placeholder="ชื่อของคุณ" autocomplete="off"></label>
  </div>
  <textarea id="wish" maxlength="80" aria-label="คำอธิษฐาน" placeholder="คำอธิษฐาน เช่น ขอให้ทุกคนที่รักสุขภาพดี"></textarea>
  <div class="row">
    <button class="btn" id="float" type="button">ลอยกระทง</button>
    <button class="btn alt" id="fort" type="button">เสี่ยงทาย</button>
  </div>
</section>

<div id="fortune" role="dialog" aria-modal="true" aria-labelledby="ft">
  <div class="card"><h2 id="ft">ดวงคืนวันเพ็ญ</h2><p id="fx"></p><button class="btn" id="close" type="button">ปิด</button></div>
</div>

<script>
const $=id=>document.getElementById(id),cv=$('c'),ctx=cv.getContext('2d'),pv=$('pv'),pctx=pv.getContext('2d');
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const ST=[
 {d:'อาทิตย์',cl:'แดง',fl:'ดอกกุหลาบ',c:['#ff9a9a','#e63946'],n:10},
 {d:'จันทร์',cl:'เหลือง',fl:'ดอกดาวเรือง',c:['#ffe27a','#ffc400'],n:12},
 {d:'อังคาร',cl:'ชมพู',fl:'ดอกบัว',c:['#ffb3d4','#ff6fa8'],n:9},
 {d:'พุธ',cl:'เขียว',fl:'ดอกไม้ใบเขียว',c:['#a5eca8','#3fbf5f'],n:8},
 {d:'พฤหัสบดี',cl:'ส้ม',fl:'ดอกจำปา',c:['#ffc58a','#ff8a1f'],n:9},
 {d:'ศุกร์',cl:'ฟ้า',fl:'ดอกอัญชันฟ้า',c:['#b2e0ff','#3fa4ff'],n:8},
 {d:'เสาร์',cl:'ม่วง',fl:'ดอกอัญชัน',c:['#cdb9ff','#7b4dff'],n:11}];
const FORT=['กระทงของคุณลอยไปไกล ความกังวลเก่าจะจางหายไปเหมือนระลอกน้ำ','เรื่องดี ๆ กำลังเดินทางมาหา โดยเฉพาะจากคนที่คุณไม่ได้คุยด้วยนาน','เปลวเทียนนิ่งสงบ ใจคุณพร้อมเริ่มต้นสิ่งใหม่ในเดือนหน้า','โชคด้านการเงินค่อย ๆ เพิ่มขึ้น ขอให้ใจเย็นและเก็บออมต่อไป','ความรักและมิตรภาพอบอุ่นขึ้น ลองทักคนที่คิดถึงคืนนี้','สุขภาพแข็งแรงขึ้น พักผ่อนให้พอ แล้วพรที่ขอจะเป็นจริง'];
const NM=['มะลิ','ฟ้าใส','น้องบัว','ปอ','ต้นกล้า','แพรวา','ภูมิ','ใจดี'];
const WS=['ขอให้ครอบครัวสุขภาพแข็งแรง','ขอให้สอบผ่านทุกวิชา','ขอบคุณแม่น้ำที่หล่อเลี้ยงเรา','ขอให้ได้เจอคนที่รัก','ขอให้งานราบรื่น เงินทองไหลมา','ขอให้ทุกเรื่องเป็นไปด้วยดี','ขอให้โลกสงบสุข','ขอให้ความทุกข์ลอยไปกับสายน้ำ'];
const SIDE=matchMedia('(min-width:800px),(max-height:520px) and (orientation:landscape)');let U=1,W,H,dpr,hz,pt,T=0,stars=[],ks=[],rip=[],spk=[],txt=[],idx=new Date().getDay(),sel=null;
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=Math.round(innerWidth);H=Math.round(innerHeight);cv.style.width=W+'px';cv.style.height=H+'px';cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);
 pv.width=96*dpr;pv.height=64*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);
 stars=Array.from({length:70},()=>({x:Math.random()*W,y:Math.random()*H*.35,r:Math.random()*1.4+.3,p:Math.random()*6}));}
function ty(r){return hz+(pt-hz)*(.25+.5*r)}
function add(st,name,wish,mine){const r=Math.random();
 const k={st,name,wish,mine,r,v:.15+Math.random()*.25,p:Math.random()*6,x:mine?W/2+(Math.random()-.5)*W*.3:Math.random()*W,y:ty(r),born:reduce?T-9:T,landed:!mine||reduce,land:reduce||!mine?T-9:0};
 ks.push(k);return k}
function flame(c,x,y,s,t,lit){if(lit<=0)return;const f=1+Math.sin(t*9+x)*.12;
 const g=c.createRadialGradient(x,y,0,x,y,s*2.6);g.addColorStop(0,'rgba(255,200,90,'+.55*lit+')');g.addColorStop(1,'rgba(255,200,90,0)');
 c.fillStyle=g;c.beginPath();c.arc(x,y,s*2.6,0,7);c.fill();
 c.fillStyle='#fff3b0';c.beginPath();c.ellipse(x,y,s*.14*f*lit,s*.3*f*lit,0,0,7);c.fill();}
function drawK(c,st,x,y,s,t,lit){const o=ST[st],col=o.c;
 c.fillStyle='rgba(255,200,90,.12)';c.beginPath();c.ellipse(x,y+s*.35,s*1.5,s*.25,0,0,7);c.fill();
 c.fillStyle='#2f8f4e';c.beginPath();c.ellipse(x,y+s*.15,s*1.1,s*.38,0,0,7);c.fill();
 c.fillStyle='#4fb872';c.beginPath();c.ellipse(x,y+s*.05,s*.95,s*.28,0,0,7);c.fill();
 for(let i=0;i<o.n;i++){const a=i/o.n*Math.PI*2,px=x+Math.cos(a)*s*.62,py=y-s*.05+Math.sin(a)*s*.2;
  c.save();c.translate(px,py);c.rotate(a);c.fillStyle=i%2?col[0]:col[1];c.beginPath();c.ellipse(0,-s*.18,s*.2,s*.42,0,0,7);c.fill();c.restore();}
 c.fillStyle='#fff7e0';c.fillRect(x-s*.07,y-s*.55,s*.14,s*.5);
 flame(c,x,y-s*.65,s,t,lit);}
function label(k){return 'วัน'+ST[k.st].d+' · กระทงสี'+ST[k.st].cl}
function draw(now){T=now/1000;hz=H*.36;U=Math.max(.85,Math.min(1.7,Math.sqrt(W*H)/650));pt=SIDE.matches?H*.92:Math.max(Math.min(H,document.querySelector('.panel').getBoundingClientRect().top),hz+150);
 let g=ctx.createLinearGradient(0,0,0,hz);g.addColorStop(0,'#04061a');g.addColorStop(1,'#1c2465');ctx.fillStyle=g;ctx.fillRect(0,0,W,hz);
 stars.forEach(s=>{ctx.globalAlpha=.4+.6*Math.abs(Math.sin(T*.8+s.p));ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,7);ctx.fill()});ctx.globalAlpha=1;
 const mx=W*.74,my=hz*.45,mr=Math.min(W*.1,hz*.2);
 g=ctx.createRadialGradient(mx,my,mr*.8,mx,my,mr*4);g.addColorStop(0,'rgba(255,230,160,.45)');g.addColorStop(1,'rgba(255,230,160,0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(mx,my,mr*4,0,7);ctx.fill();
 ctx.fillStyle='#fff1c9';ctx.beginPath();ctx.arc(mx,my,mr,0,7);ctx.fill();
 ctx.fillStyle='rgba(220,190,120,.35)';[[-.3,-.2,.22],[.25,.1,.16],[-.1,.35,.12]].forEach(q=>{ctx.beginPath();ctx.arc(mx+q[0]*mr,my+q[1]*mr,q[2]*mr,0,7);ctx.fill()});
 ctx.fillStyle='#0a0e33';ctx.beginPath();ctx.moveTo(0,hz);for(let x=0;x<=W;x+=20)ctx.lineTo(x,hz-8-Math.sin(x*.02)*6-Math.sin(x*.07)*3);ctx.lineTo(W,hz);ctx.fill();
 g=ctx.createLinearGradient(0,hz,0,H);g.addColorStop(0,'#10186a');g.addColorStop(1,'#050820');ctx.fillStyle=g;ctx.fillRect(0,hz,W,H-hz);
 for(let i=0;i<22;i++){const y=hz+8+i*i*.5*H/520,w=mr*(.5+i*.07)*(1+Math.sin(T*2+i)*.25);if(y>H)break;
  ctx.fillStyle='rgba(255,230,160,'+(.5-i*.02)+')';ctx.fillRect(mx-w/2,y,w,2);}
 // ripples
 rip=rip.filter(r=>T<r.t0+r.d);
 rip.forEach(r=>{const p=(T-r.t0)/r.d;if(p<0)return;ctx.strokeStyle='rgba(255,241,201,'+(.7*(1-p))+')';ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(r.x,r.y,r.s*p*3,r.s*p*.9,0,0,7);ctx.stroke()});
 ks.sort((a,b)=>a.y-b.y);
 ks.forEach(k=>{const sc=.6+(k.y-hz)/(pt-hz)*.6,s=30*sc*U;let off=0,lit=1;
  if(k.mine&&!k.landed){const p=Math.min(1,(T-k.born)/1.3);off=-(1-p*p)*H*.3;lit=0;
   if(p>=1){k.landed=true;k.land=T;for(let i=0;i<3;i++)rip.push({x:k.x,y:k.y+s*.2,t0:T+i*.25,d:1.8,s});
    for(let i=0;i<22;i++)spk.push({x:k.x,y:k.y-s*.3,vx:(Math.random()-.5)*90,vy:-30-Math.random()*70,t0:T,l:1.4+Math.random()*.8});
    if(k.wish)txt.push({x:k.x,y:k.y-s,t:k.wish.length>22?k.wish.slice(0,22)+'…':k.wish,t0:T})}}
  else if(k.mine){const a=T-k.land;lit=Math.min(1,a/1.2);if(a<.5)off=-Math.sin(a/.5*Math.PI)*8*sc}
  if(k!==sel&&!reduce&&k.landed){k.x+=k.v*(.5+(k.y-hz)/(pt-hz)*.8);if(k.x>W+80)k.x=-80}
  k.y+=(ty(k.r)-k.y)*.02;
  const y=k.y+off;k.sx=k.x;k.sy=y;k.ss=s;
  ctx.globalAlpha=k.mine&&!k.landed?Math.min(1,(T-k.born)*4):1;
  if(k===sel){ctx.strokeStyle='rgba(255,215,120,.85)';ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(k.x,y+s*.1,s*1.45,s*.65,0,0,7);ctx.stroke()}
  drawK(ctx,k.st,k.x,y,s,T+k.p,lit);ctx.globalAlpha=1;
  const nm=k.name||'ไม่ระบุชื่อ';ctx.font='600 '+Math.max(11,12.5*sc*U)+'px "Noto Sans Thai",sans-serif';ctx.textAlign='center';
  ctx.lineWidth=3;ctx.strokeStyle='rgba(5,8,32,.85)';ctx.strokeText(nm,k.x,y+s*.95);ctx.fillStyle=k.mine?'#fff1c9':'rgba(235,230,255,.85)';ctx.fillText(nm,k.x,y+s*.95)});
 spk=spk.filter(q=>T<q.t0+q.l);ctx.globalCompositeOperation='lighter';
 spk.forEach(q=>{const a=T-q.t0,p=a/q.l;ctx.fillStyle='rgba(255,210,100,'+(1-p)+')';ctx.beginPath();ctx.arc(q.x+q.vx*a,q.y+q.vy*a+40*a*a,2.2,0,7);ctx.fill()});
 ctx.globalCompositeOperation='source-over';
 txt=txt.filter(q=>T<q.t0+3.5);
 txt.forEach(q=>{const a=T-q.t0,p=a/3.5;ctx.globalAlpha=1-p;ctx.font='600 '+Math.round(14*Math.max(1,U*.9))+'px "Noto Sans Thai",sans-serif';ctx.textAlign='center';ctx.lineWidth=3;ctx.strokeStyle='rgba(5,8,32,.8)';
  ctx.strokeText(q.t,Math.min(W-90,Math.max(90,q.x)),q.y-a*28);ctx.fillStyle='#ffe9a8';ctx.fillText(q.t,Math.min(W-90,Math.max(90,q.x)),q.y-a*28);ctx.globalAlpha=1});
 // preview
 pctx.setTransform(dpr,0,0,dpr,0,0);pctx.clearRect(0,0,96,64);drawK(pctx,idx,48,38+Math.sin(T*1.6)*2,22,T,1);
 requestAnimationFrame(draw);}
function setIdx(i){idx=(i+7)%7;$('lab').innerHTML='กระทงวัน'+ST[idx].d+'<small>สี'+ST[idx].cl+' · '+ST[idx].fl+'</small>'}
function hit(e){const r=cv.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;
 let b=null,bd=1e9;for(const k of ks){if(!k.landed)continue;const dx=Math.abs(x-k.sx),dy=y-k.sy;if(dx<k.ss*1.7&&dy>-k.ss*1.8&&dy<k.ss*1.5){const d=dx*dx+dy*dy;if(d<bd){bd=d;b=k}}}return b}
cv.addEventListener('pointerup',e=>{const k=hit(e);if(!k){closePop();return}
 sel=k;$('pn').textContent=k.name||'ไม่ระบุชื่อ';$('ps').textContent=label(k);$('pw').textContent=k.wish||'ขอให้ทุกคนมีความสุข';
 const p=$('pop');p.hidden=false;p.style.left=Math.min(W-230,Math.max(10,k.sx-110))+'px';p.style.top=Math.max(70,k.sy-k.ss*1.5-p.offsetHeight-6)+'px'});
cv.addEventListener('pointermove',e=>{cv.style.cursor=hit(e)?'pointer':'default'});
function closePop(){sel=null;$('pop').hidden=true}
$('px').onclick=closePop;
resize();addEventListener('resize',resize);addEventListener('orientationchange',()=>setTimeout(resize,250));addEventListener('load',()=>setTimeout(resize,150));if(window.visualViewport)visualViewport.addEventListener('resize',resize);
setIdx(idx);hz=H*.36;pt=H*.7;
for(let i=0;i<8;i++)add(i%7,NM[i],WS[i],false);
requestAnimationFrame(draw);
$('prev').onclick=()=>setIdx(idx-1);$('next').onclick=()=>setIdx(idx+1);
$('bd').onchange=e=>{if(e.target.value)setIdx(new Date(e.target.value+'T00:00').getDay())};
$('float').onclick=()=>{add(idx,$('name').value.trim(),$('wish').value.trim(),true);$('wish').value=''};
$('fort').onclick=()=>{$('fx').textContent=FORT[Math.floor(Math.random()*FORT.length)];$('fortune').classList.add('on');$('close').focus()};
$('close').onclick=()=>$('fortune').classList.remove('on');
</script>
</body>
</html>
